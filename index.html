/* =========================================================

   ========================================================= */

.main-photo-wrapper {

        30px
        20px
        30px;

    display: flex;

    flex-direction: column;

    justify-content: center;

.main-photo {

    background: #e8e8e8;

    box-shadow:

        rgba(0,0,0,0.12);

    transition:

.photo-caption {

    margin-top: 12px;

    display: flex;

    justify-content: space-between;

    align-items: center;
}


.photo-number {

}


.photo-name {

    white-space: nowrap;
}


/* =========================================================

.controls {

    padding:
        12px
        30px
        18px
        30px;

    display: flex;

    align-items: center;

    gap: 8px;
}


.control-button {

    height: 38px;

    min-width: 38px;

    padding:
        0

    border:

    background: #ffffff;

    height: 100%;

    width: 0%;

    background: #222;

}

   ========================================================= */

.filmstrip {

    height: 90px;

    gap: 8px;

    padding:
        0
        30px
        20px
        30px;

    overflow-x: auto;

    scrollbar-width: none;
}


.filmstrip::-webkit-scrollbar {
    display: none;
}

    flex: none;

    width: 64px;

    height: 64px;

    position: relative;

    cursor: pointer;

    border-radius: 8px;

    overflow: hidden;

    opacity: 0.5;

    border:
        2px solid transparent;

    transition:
        all 0.2s ease;
}


.photo-card img {

    width: 100%;

    height: 100%;

    object-fit: cover;
}


.photo-card.active {

    opacity: 1;

    border-color: #222;

    transform:

}

    position: absolute;

    left: 0;

    right: 0;

    padding: 2px 4px;

   ========================================================= */

.current-photo-marker {

    width: 38px;

    height: 38px;

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;
}


.current-photo-marker .pulse {

    position: absolute;

    width: 38px;

    height: 38px;

    border:
        2px solid #111;

    border-radius: 50%;

    opacity: 0.25;

    animation:
        mapPulse 1.6s infinite;
}


.current-photo-marker .dot {

    width: 12px;

    height: 12px;

    border-radius: 50%;

    background: #111;

    border:
        3px solid #fff;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,0.35);

    z-index: 2;
}


@keyframes mapPulse {

    0% {
        transform: scale(0.65);
        opacity: 0.55;
    }

    70% {
        transform: scale(1.35);
        opacity: 0;
    }

    100% {
        transform: scale(1.35);

    }

        return [0, 0];

        window.innerWidth * 0.46,
        0
    ];

    }

    return [

    ];

            ]

        });

            lat,
            lon
        ]);

        currentMarker.setIcon(
            icon
        );

                [

                    lon
                ],
                {

                mapObject
            );
    }

}


/* =========================================================
   Photo lookup
   ========================================================= */

function getPhoto(number) {

    return photos.find(
        p => p.number === number
    );

}


/* =========================================================
   Get valid photos in segment
   ========================================================= */

function getSegmentPhotos() {

    const segment =
        segments[
            currentSegmentIndex
        ];

    return segment.photos.filter(
        number =>
            getPhoto(number)
            !== undefined
    );

}


/* =========================================================
   Render filmstrip
   ========================================================= */

function renderFilmstrip() {

    const filmstrip =
        document.getElementById(
            "filmstrip"
        );

    filmstrip.innerHTML = "";

    const numbers =
        getSegmentPhotos();


    numbers.forEach(
        number => {

            const photo =
                getPhoto(number);

            if (!photo) {
                return;
            }


            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "photo-card";

            card.dataset.number =
                number;

            card.onclick =
                () => selectPhoto(number);


            const img =
                document.createElement(
                    "img"
                );

            img.src =
                photo.src;

            img.loading =
                "lazy";

            img.alt =
                `Photo #${number}`;


            const label =
                document.createElement(
                    "div"
                );

            label.className =
                "photo-card-number";

            label.innerText =
                `#${number}`;


            card.appendChild(img);

            card.appendChild(label);

            filmstrip.appendChild(card);

        }
    );

}


/* =========================================================
   Segment navigation
   ========================================================= */

const nav =
    document.getElementById(
        "segment-nav"
    );


segments.forEach(
    (segment, index) => {

        const button =
            document.createElement(
                "button"
            );

        button.className =
            "segment-button";

        button.innerText =
            `${segment.name} · ${segment.photos.length}`;

        button.onclick =
            () => selectSegment(index);

        nav.appendChild(button);

    }
);


/* =========================================================
   Select Segment
   ========================================================= */

function selectSegment(index) {

    stopPlaying();


    currentSegmentIndex =
        index;

    currentPhotoIndex =
        0;


    document
        .querySelectorAll(
            ".segment-button"
        )
        .forEach(
            (button, i) => {

                button.classList.toggle(
                    "active",
                    i === index
                );

            }
        );


    renderFilmstrip();


    const validNumbers =
        getSegmentPhotos();


    if (
        validNumbers.length === 0
    ) {
        return;
    }


    const points =
        validNumbers
            .map(
                number =>
                    getPhoto(number)
            )
            .filter(
                photo =>
                    photo &&
                    photo.lat !== null
            )
            .map(
                photo =>
                    [
                        photo.routeLat,
                        photo.routeLon
                    ]
            );


    if (
        points.length > 0
    ) {

        mapObject.fitBounds(
            points,
            {
                padding: [
                    70,
                    70
                ],

                paddingBottomRight: getMapPanelPadding(),

                maxZoom: 17,

                animate: true,

                duration: 1.2
            }
        );

    }


    showSegmentPhoto();

}


/* =========================================================
   Show Current Photo
   ========================================================= */

function showSegmentPhoto() {

    const validNumbers =
        getSegmentPhotos();


    if (
        validNumbers.length === 0
    ) {
        return;
    }


    if (
        currentPhotoIndex >=
        validNumbers.length
    ) {

        currentPhotoIndex =
            validNumbers.length - 1;
    }


    const number =
        validNumbers[
            currentPhotoIndex
        ];


    const photo =
        getPhoto(number);


    if (!photo) {
        return;
    }


    /* -------------------------------------------------------
       Text
       ------------------------------------------------------- */

    document
        .getElementById(
            "current-segment"
        )
        .innerText =
            segments[
                currentSegmentIndex
            ].name;


    document
        .getElementById(
            "progress-text"
        )
        .innerText =
            `照片 ${currentPhotoIndex + 1} / ${validNumbers.length} · #${number}`;


    document
        .getElementById(
            "photo-number"
        )
        .innerText =
            `PHOTO #${number}`;


    document
        .getElementById(
            "photo-name"
        )
        .innerText =
            photo.name;


    /* -------------------------------------------------------
       Main Image
       ------------------------------------------------------- */

    const mainPhoto =
        document.getElementById(
            "main-photo"
        );


    mainPhoto.style.opacity =
        "0.25";


    setTimeout(
        () => {

            mainPhoto.src =
                photo.src;

            mainPhoto.alt =
                photo.name;

            mainPhoto.style.opacity =
                "1";

        },
        100
    );


    /* -------------------------------------------------------
       Filmstrip Active
       ------------------------------------------------------- */

    document
        .querySelectorAll(
            ".photo-card"
        )
        .forEach(
            card => {

                card.classList.toggle(
                    "active",
                    Number(
                        card.dataset.number
                    ) === number
                );

            }
        );


    /* -------------------------------------------------------
       Progress
       ------------------------------------------------------- */

    const progress =
        (
            currentPhotoIndex /
            Math.max(
                validNumbers.length - 1,
                1
            )
        ) * 100;


    document
        .getElementById(
            "progress-fill"
        )
        .style.width =
            progress + "%";


    /* -------------------------------------------------------
       Scroll Filmstrip
       ------------------------------------------------------- */

    const activeCard =
        document.querySelector(
            `.photo-card[data-number="${number}"]`
        );


    if (activeCard) {

        activeCard.scrollIntoView(
            {
                behavior: "smooth",

                block: "nearest",

                inline: "center"
            }
        );

    }


    /* -------------------------------------------------------
       MAP CURRENT POINT
       ------------------------------------------------------- */

    createCurrentMarker(
        photo
    );


    /* -------------------------------------------------------
       MAP FLY TO CURRENT ROUTE POINT
       ------------------------------------------------------- */

    const targetLat =
        photo.routeLat !== null
        ? photo.routeLat
        : photo.lat;


    const targetLon =
        photo.routeLon !== null
        ? photo.routeLon
        : photo.lon;


    if (
        targetLat !== null &&
        targetLon !== null
    ) {

        mapObject.stop();

        const targetZoom = 17;

        const targetCenter =
            getMapPointCenter(
                targetLat,
                targetLon,
                targetZoom
            );

        mapObject.flyTo(
            targetCenter,

            targetZoom,

            {
                duration: 0.45,

                easeLinearity: 0.25
            }
        );

    }

}


/* =========================================================
   Next Photo
   ========================================================= */

function nextPhoto() {

    const validNumbers =
        getSegmentPhotos();


    if (
        validNumbers.length === 0
    ) {
        return;
    }


    if (
        currentPhotoIndex <
        validNumbers.length - 1
    ) {

        currentPhotoIndex++;

        showSegmentPhoto();

    }
    else {

        stopPlaying();

    }

}


/* =========================================================
   Previous Photo
   ========================================================= */

function previousPhoto() {

    if (
        currentPhotoIndex > 0
    ) {

        currentPhotoIndex--;

        showSegmentPhoto();

    }

}


/* =========================================================
   Toggle Play
   ========================================================= */

function togglePlay() {

    if (isPlaying) {

        stopPlaying();

    } else {

        startPlaying();

    }

}


/* =========================================================
   Start Playing
   ========================================================= */

function startPlaying() {

    const validNumbers =
        getSegmentPhotos();


    if (
        validNumbers.length === 0
    ) {
        return;
    }


    isPlaying = true;


    document
        .getElementById(
            "play-button"
        )
        .innerText =
            "Ⅱ 暂停";


    playTimer =
        setInterval(
            () => {

                if (
                    currentPhotoIndex >=
                    validNumbers.length - 1
                ) {

                    stopPlaying();

                    return;

                }


                currentPhotoIndex++;

                showSegmentPhoto();

            },
            1000
        );

}


/* =========================================================
   Stop Playing
   ========================================================= */

function stopPlaying() {

    isPlaying = false;


    if (playTimer) {

        clearInterval(
            playTimer
        );

        playTimer = null;

    }


    document
        .getElementById(
            "play-button"
        )
        .innerText =
            "▶ 播放";

}


/* =========================================================
   Select Photo
   ========================================================= */

function selectPhoto(number) {

    const photo =
        getPhoto(number);


    if (!photo) {
        return;
    }


    let foundSegment =
        -1;

    let foundIndex =
        -1;


    segments.forEach(
        (
            segment,
            segmentIndex
        ) => {

            const validNumbers =
                segment.photos.filter(
                    n =>
                        getPhoto(n)
                        !== undefined
                );


            const index =
                validNumbers.indexOf(
                    number
                );


            if (index !== -1) {

                foundSegment =
                    segmentIndex;

                foundIndex =
                    index;

            }

        }
    );


    if (
        foundSegment !== -1
    ) {

        currentSegmentIndex =
            foundSegment;

        currentPhotoIndex =
            foundIndex;


        document
            .querySelectorAll(
                ".segment-button"
            )
            .forEach(
                (button, i) => {

                    button.classList.toggle(
                        "active",
                        i === foundSegment
                    );

                }
            );


        renderFilmstrip();

    }


    showSegmentPhoto();

}
